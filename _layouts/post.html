<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 动态读取文章标题和网站名称 -->
  <title>{{ page.title }} | {{ site.data.site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.data.site.description }}">
  
  <!-- 核心修复：使用 relative_url 确保无论在哪个层级都能正确加载 css -->
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  
  <style>
    /* 文章页专属补充样式 */
    .post-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .post-header { margin-bottom: 30px; text-align: center; }
    .post-title { font-size: 2em; margin-bottom: 10px; }
    .post-meta { color: #666; font-size: 0.9em; }
    .post-content { line-height: 1.8; font-size: 1.1em; }
    .post-content h2 { margin-top: 2em; }
    .post-content p { margin-bottom: 1.5em; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <!-- 动态读取后台填写的名字 -->
      <a href="{{ '/' | relative_url }}" class="logo">{{ site.data.site.name }}<span class="logo-dot">.</span></a>
      <nav class="site-nav">
        <!-- 确保正确跳回主页 -->
        <a href="{{ '/#latest' | relative_url }}" class="nav-link">返回首页</a>
      </nav>
    </div>
  </header>

  <main class="post-container">
    <article>
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">
          <span>分类：{{ page.category }}</span> | 
          <span>发布时间：{{ page.date | date: "%Y-%m-%d" }}</span>
        </div>
      </header>
      
      <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">
      
      <div class="post-content">
        {{ content }}
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <!-- 动态读取当前年份和网站名称 -->
      <p>© {{ site.time | date: "%Y" }} {{ site.data.site.title }} · 用文字固化思考</p>
    </div>
  </footer>
</body>
</html>

locale: zh_Hans

backend:
  name: git-gateway
  repo: taizili/jingshuiliushen        # 请确保这里填对，例如 octocat/my-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/13b42e81-e184-4d7a-b2de-27db3ac264a3/pkce
  auth_token_endpoint: /sites/13b42e81-e184-4d7a-b2de-27db3ac264a3/token
  gateway_url: https://gateway.decapbridge.com

# 下面的 media_folder 等配置保持你原来的不变
site_url: https://taizili.github.io

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    create: true
    extension: md
    format: frontmatter
    sortable_fields: [date, title]
    summary: "{{title}} · {{date}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: 分类, name: category, widget: select, options: [实验方法, 学习心得, 踩坑记录] }
      - { label: 网址后缀（小写英文和短横线，留空自动生成）, name: slug, widget: string, required: false, pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "只允许小写英文字母、数字和短横线"] }
      - { label: 摘要（显示在首页）, name: excerpt, widget: text }
      - { label: 正文, name: body, widget: markdown }

  - name: settings
    label: 网站设置
    files:
      - label: 基本设置
        name: site
        file: site.json
        fields:
          - { label: 你的名字, name: name, widget: string }
          - { label: 网站名称, name: title, widget: string }
          - { label: 首页大标题, name: heroTitle, widget: text }
          - { label: 网站简介, name: description, widget: text }
